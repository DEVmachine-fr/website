[build.environment]
  RUBY_VERSION = "3.2.2"

[context.production]
    command = "bundle exec jekyll build"

[context.deploy-preview]
    command = "bundle exec jekyll build --drafts"

[[redirects]]
  from = "https://devmachine.fr/*"
  to = "https://www.devmachine.fr/:splat"
  status = 301
  force = true
